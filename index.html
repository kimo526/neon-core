<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>NEON CORE // 解限核心</title>
<meta name="description" content="热管理驱动的机甲 roguelite 竞技场：热量会锁枪、冲刺能穿敌、每 5 波来一个弹幕核心。支持本地双人与极限模式（不回血）。" />
<meta name="theme-color" content="#06070d" />
<meta name="color-scheme" content="dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NEON CORE" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png" />
<link rel="apple-touch-icon" href="./assets/icon-192.png" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!--
    结构说明（改布局前先看这里）：
      #stage
        ├─ .stage-inner   画布 + HUD 叠层（标题页会被 display:none 收起来）
        ├─ #overlay       标题 / 选卡 / 结算 / 暂停，遮罩层
        └─ aside#hints    侧边（窄屏折到下方）操作提示面板
    #overlay 必须是 #stage 的直接子元素：它要盖住画布，但标题页收起画布时它得留着。
  -->
  <div id="stage">
    <div class="stage-inner">
      <canvas id="game" width="960" height="540"></canvas>
      <div id="hud"></div>
    </div>

    <div id="overlay" class="show"></div>

    <aside id="hints" aria-label="操作提示"></aside>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
