<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>NEON CORE // 解限核心</title>
<meta name="description" content="热管理驱动的机甲 roguelite 竞技场：热量会锁枪、冲刺能穿敌、每 5 波来一个弹幕核心。支持本地双人与极限模式（不回血）。" />
<meta name="theme-color" content="#06070d" />
<meta name="color-scheme" content="dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NEON CORE" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png" />
<link rel="apple-touch-icon" href="./assets/icon-192.png" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="stage">
    <div class="stage-inner">
      <canvas id="game" width="960" height="540"></canvas>
      <div id="hud"></div>
      <div id="overlay" class="show">
        <div class="panel">
          <h1>NEON <span>CORE</span></h1>
          <p class="sub">突入熔炉竞技场，把核心烧穿。</p>
          <ul class="keys">
            <li><b>W A S D</b> 移动</li>
            <li><b>鼠标</b> 瞄准 &nbsp;/&nbsp; <b>左键</b> 射击</li>
            <li><b>空格</b> 冲刺（无敌帧，穿敌）</li>
            <li><b>1 2 3</b> 选择强化</li>
          </ul>
          <p class="hint" id="overlay-hint">按 <b>回车</b> 或点击这里开始</p>
        </div>
      </div>
    </div>
    <aside id="hints" aria-label="操作提示"></aside>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
